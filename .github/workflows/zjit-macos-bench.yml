name: ZJIT macOS Benchmarks
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }} / ${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: ZJIT Benchmark Diff
    runs-on: macos-14

    if: startsWith(github.event.pull_request.title, 'ZJIT:')

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Need full history for git worktree operations

      - name: Install libraries
        uses: ./.github/actions/setup/macos

      - name: Fetch master branch
        run: git fetch origin master:master

      - name: Run zjit_diff.rb
        run: |
          set -o pipefail
          # Run the benchmark diff script comparing master to current HEAD
          # Capture output to a file for the PR comment
          tool/zjit_diff.rb --before master railsbench | tee benchmark_output.txt

      - name: Comment benchmark results on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const benchmarkOutput = fs.readFileSync('benchmark_output.txt', 'utf8');
            const runLink = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const magicComment = `<!-- ZJIT-BENCHMARK-RESULTS -->`;

            const comment = `${magicComment}
            ## ZJIT Benchmark Results

            Comparing \`master\` (before) vs \`${{ github.event.pull_request.head.sha }}\` (after)

            <details>
            <summary>Benchmark Output</summary>

            \`\`\`
            ${benchmarkOutput}
            \`\`\`

            </details>

            ---
            *This comment was automatically generated by the [ZJIT macOS Benchmarks](${runLink}) workflow.*
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body.startsWith(magicComment));

            if (existingComment) {
              core.info(`Updating existing comment: ${existingComment.html_url}`);
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment,
              });
            } else {
              core.info('Creating new comment');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

      - name: Cleanup worktrees
        if: always()
        run: tool/zjit_diff.rb --clean || true
